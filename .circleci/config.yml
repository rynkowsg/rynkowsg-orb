version: 2.1

setup: true

orbs:
  # orb info: https://circleci.com/developer/orbs/orb/rynkowsg/checkout
  checkout: rynkowsg/checkout@0.3.2
  # orb info: https://circleci.com/developer/orbs/orb/rynkowsg/mise
  # changelog: https://github.com/rynkowsg/mise-orb/blob/main/CHANGELOG.md
  mise: rynkowsg/mise@0.1.0
  # orb info: https://circleci.com/developer/orbs/orb/circleci/orb-tools
  # changelog: https://github.com/CircleCI-Public/orb-tools-orb/releases
  orb-tools: circleci/orb-tools@12.5.0
  # orb info: https://circleci.com/developer/orbs/orb/rynkowsg/rynkowsg
  # The published orb, used here for install_sosh. The orb built in this repo is
  # tested in test-deploy.yml, not here.
  rynkowsg: rynkowsg/rynkowsg@0.7.0
  # orb info: https://circleci.com/developer/orbs/orb/circleci/shellcheck
  # changelog: https://github.com/CircleCI-Public/shellcheck-orb/releases
  shellcheck: circleci/shellcheck@3.4.0
  # inline orb
  inline:
    executors:
      docker_base_small:
        # https://circleci.com/developer/images/image/cimg/base
        # https://hub.docker.com/r/cimg/base/tags
        docker: [{image: 'cimg/base:2026.09-24.04'}]
        resource_class: small

# Every branch and every tag. Tags have to be named: a job with no tag filter is
# skipped when a tag is pushed, and this is a setup config - if nothing here runs
# on a tag, nothing continues to test-deploy.yml and a release cannot publish.
run_always: &run_always
  branches: {only: '/.*/'}
  tags: {only: '/.*/'}

jobs:
  lint_and_format:
    executor: inline/docker_base_small
    steps:
      - checkout/checkout: {depth: 1}
      - mise/setup:
          mise_version: v2026.9.4 # https://github.com/jdx/mise/releases
          # java is here because babashka needs it, and babashka runs sosh.
          tools: >-
            babashka java
            shellcheck
            shfmt
            yamlfmt
      - rynkowsg/install_sosh: {version: "v0.2.1"}
      - run: make format-shell/check
      - run: make format-yaml/check
      - run: make lint-shell/check

workflows:
  lint-pack:
    jobs:
      - lint_and_format:
          filters: *run_always

      - shellcheck/check:
          filters: *run_always

      - orb-tools/lint:
          executor: {name: orb-tools/python, resource_class: small}
          filters: *run_always

      - orb-tools/pack:
          executor: {name: orb-tools/default, resource_class: small}
          filters: *run_always

      - orb-tools/review:
          executor: {name: orb-tools/default, resource_class: small}
          filters: *run_always

      - orb-tools/continue:
          executor: {name: orb-tools/default, resource_class: small}
          requires:
            - lint_and_format
            - orb-tools/lint
            - orb-tools/pack
            - orb-tools/review
            - shellcheck/check
          filters: *run_always
          orb_name: rynkowsg
          pipeline_number: <<pipeline.number>>
          vcs_type: <<pipeline.project.type>>
