version: 2.1
orbs:
  # changelog: https://github.com/CircleCI-Public/BATS-orb/releases
  bats: circleci/bats@1.1.0
  # orb info: https://circleci.com/developer/orbs/orb/rynkowsg/mise
  # changelog: https://github.com/rynkowsg/mise-orb/blob/main/CHANGELOG.md
  mise: rynkowsg/mise@0.1.0
  # orb info: https://circleci.com/developer/orbs/orb/circleci/orb-tools
  # changelog: https://github.com/CircleCI-Public/orb-tools-orb/releases
  orb-tools: circleci/orb-tools@12.5.0
  # orb in this repo
  rynkowsg: {}

# Every branch and every tag. Tags have to be named: a job with no tag filter is
# skipped when a tag is pushed, and the publish jobs below require these, so on a
# release tag they would have nothing to wait for.
run_always: &run_always
  branches: {only: '/.*/'}
  tags: {only: '/.*/'}

# Only a release tag, never a branch.
run_on_release: &run_on_release
  branches: {ignore: '/.*/'}
  tags: {only: '/^v[0-9]+\.[0-9]+\.[0-9]+$/'}

jobs:
  test_executor:
    parameters:
      executor: {type: executor}
    executor: <<parameters.executor>>
    steps:
      - run: uname -a

  test_install_commands:
    executor: rynkowsg/docker_x86_cimg_base
    steps:
      - checkout
      - bats/install
      - mise/setup:
          mise_version: v2026.9.4 # https://github.com/jdx/mise/releases
          # The commands under test install their own binaries. java is here
          # because install_babashka drops a bb that needs a JVM to run.
          tools: java
      # yq
      - rynkowsg/install_yq: {install_dir: ~/bin, version: "4.53.6", debug: true}
      - run:
          name: "test command: install_yq"
          command: VERSION="4.53.6" INSTALL_DIR=~/bin ./test/commands/test_command_install_yq.bats
      # clj-kondo
      - rynkowsg/install_clj_kondo: {install_dir: ~/bin, version: "2026.08.04", debug: true}
      - run:
          name: "test command: install_clj_kondo"
          command: VERSION="2026.08.04" INSTALL_DIR=~/bin ./test/commands/test_command_install_clj_kondo.bats
      # babashka
      - rynkowsg/install_babashka: {install_dir: ~/bin, version: "1.13.220", debug: true}
      - run:
          name: "test command: install_babashka"
          command: VERSION="1.13.220" INSTALL_DIR=~/bin ./test/commands/test_command_install_babashka.bats
      # sosh
      - rynkowsg/install_sosh: {install_dir: ~/bin, version: "main", debug: true}
      - run:
          name: "test command: install_sosh"
          command: VERSION="main" INSTALL_DIR=~/bin ./test/commands/test_command_install_sosh.bats

  test_macos_commands:
    parameters:
      executor: {type: executor}
    executor: <<parameters.executor>>
    steps:
      - run: uname -a
      - rynkowsg/macos_install_bash
      - rynkowsg/macos_set_term

  test_add_to_path_bats:
    executor: rynkowsg/docker_x86_cimg_base
    steps:
      - checkout
      - bats/install
      - run:
          name: "test command: add_to_path"
          command: ./test/commands/test_command_add_to_path.bats

  test_add_to_path_command:
    executor: rynkowsg/docker_x86_cimg_base
    steps:
      - run: mkdir -p /tmp/att/bin /tmp/att/tools
      - rynkowsg/add_to_path: {path: "/tmp/att/bin", debug: true}
      - rynkowsg/add_to_path: {paths: "/tmp/att/bin:/tmp/att/tools", debug: true}
      - run:
          name: "verify PATH contains added directories"
          command: |
            set -euo pipefail
            echo "${PATH}"
            echo "${PATH}" | tr ':' '\n' | grep -qx "/tmp/att/bin"
            echo "${PATH}" | tr ':' '\n' | grep -qx "/tmp/att/tools"

workflows:
  test-deploy:
    jobs:
      - test_executor:
          name: "test_executor; E:<<matrix.executor>>"
          matrix:
            parameters:
              executor:
                - rynkowsg/docker_arm
                - rynkowsg/docker_arm_cimg_base
                - rynkowsg/docker_x86
                - rynkowsg/docker_x86_cimg_android
                - rynkowsg/docker_x86_cimg_base
                - rynkowsg/docker_x86_cimg_clojure
                - rynkowsg/docker_x86_cimg_python
                - rynkowsg/machine_arm
                - rynkowsg/machine_arm_ubuntu2204
                - rynkowsg/machine_arm_ubuntu2404
                - rynkowsg/machine_arm_ubuntu2604
                - rynkowsg/machine_x86_android
                - rynkowsg/machine_x86_ubuntu2204
                - rynkowsg/machine_x86_ubuntu2404
                - rynkowsg/machine_x86_ubuntu2604
                - rynkowsg/macos
          filters: *run_always

      - test_install_commands:
          filters: *run_always

      - test_macos_commands:
          name: "test_macos_commands; E:<<matrix.executor>>"
          matrix:
            parameters:
              executor:
                - rynkowsg/macos
          filters: *run_always

      - test_add_to_path_bats:
          filters: *run_always

      - test_add_to_path_command:
          filters: *run_always

      - orb-tools/pack:
          requires:
            - test_executor
            - test_install_commands
            - test_macos_commands
            - test_add_to_path_bats
            - test_add_to_path_command
          filters: *run_always

      - orb-tools/publish:
          name: publish-dev
          requires:
            - orb-tools/pack
          context: circleci/orb-publishing-context
          filters: *run_always
          orb_name: rynkowsg/rynkowsg
          pub_type: dev
          vcs_type: <<pipeline.project.type>>

      - orb-tools/publish:
          name: publish-prod
          requires:
            - publish-dev
          context: circleci/orb-publishing-context
          filters: *run_on_release
          orb_name: rynkowsg/rynkowsg
          pub_type: production
          vcs_type: <<pipeline.project.type>>
