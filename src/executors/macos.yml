description: >
  MacOS executor.

macos:
  xcode: 26.5.0

resource_class: <<parameters.resource_class>>

parameters:
  xcode:
    # https://circleci.com/developer/machine/image/xcode#image-tags
    type: string
    default: "26.5.0"
    description: >
      Version of Xcode.

  resource_class:
    # https://circleci.com/docs/configuration-reference/#macos-execution-environment
    description: Configure the executor resource class
    type: enum
    enum: ["m4pro.medium", "m4pro.large"]
    default: "m4pro.medium"
