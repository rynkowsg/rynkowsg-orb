description: >
  Exports an AWS profile's credentials into BASH_ENV for subsequent steps via
  `aws configure export-credentials`. Any AWS credentials previously written to
  BASH_ENV (aws-cli orb vars and the current role's secrets) are cleared first.

parameters:
  custom_name:
    type: string
    default: "rynkowsg/aws_export_credentials"
    description: "Custom step name."
  debug:
    type: boolean
    default: false
    description: "Flag to run the script in debug mode."
  profile:
    type: string
    description: "AWS profile whose credentials are exported."

steps:
  - run:
      environment:
        PARAM_DEBUG: <<parameters.debug>>
        PARAM_PROFILE: <<parameters.profile>>
      name: <<parameters.custom_name>>
      command: <<include(scripts/aws_export_credentials.bash)>>
