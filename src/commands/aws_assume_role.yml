description: >
  Assumes an AWS role via `aws sts assume-role` and exports the resulting
  credentials into BASH_ENV for subsequent steps. Any AWS credentials
  previously written to BASH_ENV (aws-cli orb vars and the current role's
  secrets) are cleared first.

parameters:
  custom_name:
    type: string
    default: "rynkowsg/aws_assume_role"
    description: "Custom step name."
  debug:
    type: boolean
    default: false
    description: "Flag to run the script in debug mode."
  role_arn:
    type: string
    description: "ARN of the role to assume."
  role_session_name:
    type: string
    description: "Session name for the assumed role."
  profile:
    type: string
    default: ""
    description: >
      Optional source profile that calls sts:AssumeRole. When empty, --profile
      is omitted and the default credential chain is used.

steps:
  - run:
      environment:
        PARAM_DEBUG: <<parameters.debug>>
        PARAM_PROFILE: <<parameters.profile>>
        PARAM_ROLE_ARN: <<parameters.role_arn>>
        PARAM_ROLE_SESSION_NAME: <<parameters.role_session_name>>
      name: <<parameters.custom_name>>
      command: <<include(scripts/aws_assume_role.bash)>>
