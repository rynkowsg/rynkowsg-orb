description: >
  Runs a command with credentials from an AWS profile. Materializes the
  profile's credentials into the step's shell via
  `aws configure export-credentials`, then runs the given command. Nothing is
  written to BASH_ENV, so the credentials are scoped to this single step.

parameters:
  custom_name:
    type: string
    default: "rynkowsg/aws_with_profile"
    description: "Custom step name."
  debug:
    type: boolean
    default: false
    description: "Flag to run the script in debug mode."
  profile:
    type: string
    description: "AWS profile whose credentials are used."
  command:
    type: string
    description: "Command to run with the profile's credentials in scope."

steps:
  - run:
      environment:
        PARAM_DEBUG: <<parameters.debug>>
        PARAM_PROFILE: <<parameters.profile>>
        PARAM_COMMAND: <<parameters.command>>
      name: <<parameters.custom_name>>
      command: <<include(scripts/aws_with_profile.bash)>>
