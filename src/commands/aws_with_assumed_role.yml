description: >
  Runs a command with credentials from an assumed AWS role. Assumes role_arn
  via `aws sts assume-role`, exports the temporary credentials into the step's
  shell, then runs the given command. Nothing is written to BASH_ENV, so the
  credentials are scoped to this single step.

parameters:
  custom_name:
    type: string
    default: "rynkowsg/aws_with_assumed_role"
    description: "Custom step name."
  debug:
    type: boolean
    default: false
    description: "Flag to run the script in debug mode."
  role_arn:
    type: string
    description: "ARN of the role to assume."
  role_session_name:
    type: string
    description: "Session name for the assumed role."
  profile:
    type: string
    default: ""
    description: >
      Optional source profile that calls sts:AssumeRole. When empty, --profile
      is omitted and the default credential chain is used.
  command:
    type: string
    description: "Command to run with the assumed-role credentials in scope."

steps:
  - run:
      environment:
        PARAM_DEBUG: <<parameters.debug>>
        PARAM_PROFILE: <<parameters.profile>>
        PARAM_ROLE_ARN: <<parameters.role_arn>>
        PARAM_ROLE_SESSION_NAME: <<parameters.role_session_name>>
        PARAM_COMMAND: <<parameters.command>>
      name: <<parameters.custom_name>>
      command: <<include(scripts/aws_with_assumed_role.bash)>>
